databases:
  - name: gym-routine-db
    databaseName: gymdb
    user: gymuser
    plan: free

services:
  - type: web
    name: gym-routine-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: gym-routine-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gym-routine-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gym-routine-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gym-routine-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gym-routine-db
          property: password

  - type: web
    name: gym-routine-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gym-routine-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gym-routine-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
